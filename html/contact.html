<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Ski Club Guebwiller : Refuge Grand-Ballon Roedelen Club Ski de Fond de Guebwiller">

    <title>SCG : Refuge Grand-Ballon Roedelen club ski de fond de Guebwiller</title>
    <link rel="shortcut icon" type="image/x-icon" href="../media/favicon.ico">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/scripts.js"></script>
    <script src="../scripts/header.js" defer></script>
    <script src="../scripts/nav.js" defer></script>
    <script src="../scripts/footer.js" defer></script>
    <script src="../scripts/h6.js" defer></script>

    <style>
        h2 {
            margin: 50px;
        }

        form {
            margin: 50px;
        }

        form>label {
            margin-left: 50px;
        }

        form>input {
            margin-left: 50px;
            width: 90%;
            margin-bottom: 10px;
        }

        form>textarea {
            margin-left: 50px;
            width: 90%;
            margin-bottom: 10px;
            height: 100px;
        }

        form>input[type="submit"] {
            margin: 10px 27.5%;
            width: 40%;
            color: #000;
            background-color: #31d2f2;
            border-color: #25cff2;
            border-radius: 5px;
            padding: 10px;
        }
    </style>
</head>

<body oncopy="return false" oncut="return false" onpaste="return false" oncontextmenu="return false"
    onselectstart="return false" ondragstart="return false">

    <nav class="telescript">
        <!-- TELESCRIPT -->
    </nav>

    <header id="header"></header>

    <nav class="nav" id="nav"></nav>

    <main style="background-color: #f5f5f5;">

        <h2>Nous contacter :</h2>
        <form action="">
            <label for="email">Email :</label>
            <input type="email" id="email" name="email">
            <br />
            <label for="sujet">Sujet :</label>
            <input type="text" id="sujet" name="sujet">
            <br />
            <label for="message">Message :</label>
            <textarea id="message" name="message"></textarea>
            <br />
            <input type="submit" value="Envoyer">
        </form>


    </main>

    <footer id="footer"></footer>

    <h6 id="h6"></h6>

</body>

</html>
