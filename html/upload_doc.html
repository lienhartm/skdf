<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Ski Club Guebwiller : Refuge Grand-Ballon Roedelen Club Ski de Fond de Guebwiller">

    <title>SCG : Refuge Grand-Ballon Roedelen club ski de fond de Guebwiller</title>
    <link rel="shortcut icon" type="image/x-icon" href="../media/favicon.ico">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../scripts/header.js" defer></script>
    <script src="../scripts/nav.js" defer></script>
    <script src="../scripts/footer.js" defer></script>
    <script src="../scripts/h6.js" defer></script>

    <style>
        form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 50px;
        }

        form>label {
            margin-top: 10px;
        }

        form>input {
            width: 20%;
            margin-bottom: 10px;
        }

        form>textarea {
            width: 20%;
            margin-bottom: 10px;
        }

        form>div {
            width: 20%;
            margin-bottom: 10px;
        }

        form>input[type="submit"] {
            margin: 50px;
            width: 20%;
            color: #000;
            background-color: #31d2f2;
            border-color: #25cff2;
            border-radius: 5px;
            padding: 10px;
        }
    </style>
</head>

<body oncopy="return false" oncut="return false" onpaste="return false" oncontextmenu="return false"
    onselectstart="return false" ondragstart="return false">

    <nav class="telescript">
        <!-- TELESCRIPT -->
    </nav>

    <header id="header"></header>

    <nav class="nav" id="nav"></nav>

    <main style="background-color: #f5f5f5;">

        <h3><a href="admin.html">Retour à l'accueil de l'administration</a></h3>
        <h2>Upload un Résultats</h2>
        <form method="post">
            <label for="type">Type de document</label>
            <select id="type" name="type">
                <option value="resultats">Résultats</option>
                <option value="presse">Revue de presse</option>
            </select>
            <label for="title">Titre</label>
            <input type="text" id="title" name="title">
            <label for="file-doc">Fichier</label>
            <input type="file" id="file-doc" name="file">
            <input type="submit" value="Envoyer">
        </form>

        <br />

        <h2>Articles de presse</h2>
        <ul id="list-presse">

        </ul>

        <h2>Résultat sportifs</h2>
        <ul id="list-resultats">

        </ul>

        <script>
            fetch('../media/presses/presses.json')
                .then(response => response.json())
                .then(data => {
                    const actualitesContainer = document.getElementById('list-presse');
                    const path = '../media/presses/';
                    data.forEach(press => {
                        const pressDiv = document.createElement('li');
                        pressDiv.classList.add('presse');

                        pressDiv.innerHTML = `<a href="${path}${press.document}" target="_blank">${press.titre}</a>
                        <a href="">Modifier</a>
                        <a href="">Supprimer</a>`;
                        actualitesContainer.appendChild(pressDiv);
                    });
                })
                .catch(error => console.error("Erreur lors du chargement des articles de presse:", error));

            /*---*/

            fetch('../media/resultats/resultats.json')
                .then(response => response.json())
                .then(data => {
                    const actualitesContainer = document.getElementById('list-resultats');
                    const path = '../media/resultats/';
                    data.forEach(resultat => {
                        const resultDiv = document.createElement('li');
                        resultDiv.classList.add('resultat');

                        resultDiv.innerHTML = `<a href="${path}${resultat.document}" target="_blank">${resultat.titre}</a>
                        <a href="">Modifier</a>
                        <a href="">Supprimer</a>`;
                        actualitesContainer.appendChild(resultDiv);
                    });
                })
                .catch(error => console.error("Erreur lors du chargement des articles de presse:", error));

        </script>

    </main>

    <footer id="footer"></footer>

    <h6 id="h6"></h6>


</body>

</html>
