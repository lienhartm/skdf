<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Ski Club Guebwiller : Refuge Grand-Ballon Roedelen Club Ski de Fond de Guebwiller">

    <title>SCG : Refuge Grand-Ballon Roedelen club ski de fond de Guebwiller</title>
    <link rel="shortcut icon" type="image/x-icon" href="../media/favicon.ico">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/scripts.js"></script>
    <script src="../scripts/header.js" defer></script>
    <script src="../scripts/nav.js" defer></script>
    <script src="../scripts/footer.js" defer></script>
    <script src="../scripts/h6.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 50px;
        }

        form>label {
            margin-top: 10px;
        }

        form>input {
            width: 75%;
            margin-bottom: 10px;
        }

        form>textarea {
            width: 75%;
            margin-bottom: 10px;
        }

        form>div {
            width: 20%;
            margin-bottom: 10px;
        }

        form>input[type="submit"] {
            margin: 50px;
            width: 20%;
            color: #000;
            background-color: #31d2f2;
            border-color: #25cff2;
            border-radius: 5px;
            padding: 10px;
        }

        div#apercu-article {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        div#apercu-article h1,
        div#apercu-article h2,
        div#apercu-article h3,
        div#apercu-article h4,
        div#apercu-article h5,
        div#apercu-article h6 {
            color: #111;
            font-weight: bold;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            line-height: 1.2;
            text-shadow: none;
        }

        div#apercu-article h1 {
            font-size: 2em;
        }

        div#apercu-article h2 {
            font-size: 1.5em;
        }

        div#apercu-article h3 {
            font-size: 1.17em;
        }

        div#apercu-article h4 {
            font-size: 1em;
        }

        div#apercu-article p {
            margin-bottom: 1em;
        }

        div#apercu-article ul,
        div#apercu-article ol {
            margin-bottom: 1em;
            padding-left: 40px;
        }

        div#apercu-article ul {
            list-style-type: disc;
        }

        div#apercu-article ol {
            list-style-type: decimal;
        }

        div#apercu-article li {
            margin-bottom: 0.25em;
            display: list-item;
        }

        div#apercu-article b,
        div#apercu-article strong {
            font-weight: bold;
        }

        div#apercu-article i,
        div#apercu-article em {
            font-style: italic;
        }

        div#apercu-article a {
            text-decoration: underline;
            color: #0d6efd;
        }

        div#apercu-article a:hover {
            color: #0a58ca;
        }

        div#apercu-article blockquote {
            margin: 1em 40px;
            border-left: 4px solid #ccc;
            padding-left: 1em;
            color: #666;
            font-style: italic;
        }

        div#apercu-article code {
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            background-color: #f4f4f4;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 0.9em;
        }

        div#apercu-article pre {
            background-color: #f4f4f4;
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 1em;
        }

        div#apercu-article pre code {
            background-color: transparent;
            padding: 0;
            font-size: 1em;
        }

        div#apercu-article img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1em 0;
        }

        div#apercu-article hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 2em 0;
        }
    </style>
</head>

<body oncopy="return false" oncut="return false" onpaste="return false" oncontextmenu="return false"
    onselectstart="return false" ondragstart="return false">

    <nav class="telescript">
        <!-- TELESCRIPT -->
    </nav>

    <header id="header"></header>

    <nav class="nav" id="nav"></nav>

    <main style="background-color: #f5f5f5;">

        <h3><a href="admin.html">Retour à l'accueil de l'administration</a></h3>

        <br />

        <div style="margin: 20px 50px;display: flex;flex-direction: row;align-items: space-between;">
            <form method="post" style="width: 50%;">
                <h2>Ajouter un article</h2>
                <label for="author">Auteur</label>
                <input type="text" id="author" name="author">
                <label for="date">Date</label>
                <input type="date" id="date" name="date">
                <label for="type">Type d'article :
                    <select id="type" name="type">
                        <option value="refuge">Refuge</option>
                        <option value="club">Club</option>
                        <option value="event">Événement</option>
                    </select>
                </label>
                <label for="title">Titre</label>
                <input type="text" id="title" name="title">
                <label for="content">Contenu</label>
                <textarea id="content" name="content"></textarea>
                <label for="file-image">Image</label>
                <input type="file" id="file-image" name="file" multiple>
                <input type="submit" value="Ajouter">
            </form>

            <div style="width: 50%;">
                <h2>Aperçu de l'article</h2>
                <div id="apercu-article"
                    style="margin: 20px 50px; padding: 20px; border: 1px solid #ccc; background-color: white; border-radius: 5px; min-height: 50px;">
                </div>
                <div id="apercu-images"
                    style="display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 50px; padding: 20px; border: 1px solid #ccc; background-color: white; border-radius: 5px; min-height: 50px;">
                </div>
            </div>

        </div>

        <h2>Liste des articles</h2>
        <ul id="list-article">

        </ul>

        <script>

            fetch('../media/articles/actus.json')
                .then(response => response.json())
                .then(data => {
                    const actualitesContainer = document.getElementById('list-article');
                    const path = '../media/articles/';
                    data.forEach(article => {
                        const articleDiv = document.createElement('li');
                        articleDiv.classList.add('article');

                        articleDiv.innerHTML = `${article.titre}
                        <a href="">Modifier</a>
                        <a href="">Supprimer</a>`;
                        actualitesContainer.appendChild(articleDiv);
                    });
                })
                .catch(error => console.error("Erreur lors du chargement des articles:", error));


            document.addEventListener('DOMContentLoaded', function () {
                // Markdown Preview Logging
                const contentInput = document.getElementById('content');
                const apercuDiv = document.getElementById('apercu-article');

                contentInput.addEventListener('input', function () {
                    apercuDiv.innerHTML = marked.parse(contentInput.value);
                });

                // Image Upload Preview and Remove Logic
                const fileInput = document.getElementById('file-image');
                const listImages = document.getElementById('apercu-images');

                // Store selected files in an array since FileList is read-only
                let selectedFiles = [];

                fileInput.addEventListener('change', function (e) {
                    const newFiles = Array.from(e.target.files);
                    selectedFiles = selectedFiles.concat(newFiles);
                    updateImageList();
                });

                function updateImageList() {
                    listImages.innerHTML = ''; // Clear previous previews

                    // Create a new DataTransfer object to update the actual file input
                    const dataTransfer = new DataTransfer();

                    selectedFiles.forEach((file, index) => {
                        // Add file to data transfer
                        dataTransfer.items.add(file);

                        // Only process image files
                        if (!file.type.match('image.*')) return;

                        const reader = new FileReader();

                        reader.onload = function (e) {
                            const imgContainer = document.createElement('div');
                            imgContainer.style.position = 'relative';
                            imgContainer.style.width = '100px';
                            imgContainer.style.height = '100px';

                            const img = document.createElement('img');
                            img.src = e.target.result;
                            img.title = file.name;
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'cover';
                            img.style.borderRadius = '5px';
                            img.style.border = '1px solid #ccc';

                            const removeBtn = document.createElement('button');
                            removeBtn.innerHTML = '&times;';
                            removeBtn.style.position = 'absolute';
                            removeBtn.style.top = '-5px';
                            removeBtn.style.right = '-5px';
                            removeBtn.style.background = 'red';
                            removeBtn.style.color = 'white';
                            removeBtn.style.border = 'none';
                            removeBtn.style.borderRadius = '50%';
                            removeBtn.style.cursor = 'pointer';
                            removeBtn.style.width = '20px';
                            removeBtn.style.height = '20px';
                            removeBtn.style.lineHeight = '20px';
                            removeBtn.style.padding = '0';
                            removeBtn.style.fontSize = '14px';

                            removeBtn.addEventListener('click', function (event) {
                                event.preventDefault(); // Prevent form submission
                                // Remove file from our array
                                selectedFiles.splice(index, 1);
                                // Re-render the list and update input
                                updateImageList();
                            });

                            imgContainer.appendChild(img);
                            imgContainer.appendChild(removeBtn);
                            listImages.appendChild(imgContainer);
                        }

                        reader.readAsDataURL(file);
                    });

                    // Update the actual file input with the modified list
                    fileInput.files = dataTransfer.files;
                }
            });
        </script>

        <br />

    </main>

    <footer id="footer"></footer>

    <h6 id="h6"></h6>

</body>

</html>
